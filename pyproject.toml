[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sigr-bdma"
version = "0.1.0"
authors = [{name = "Yingjie Shan", email = "yingjieshanjrh@gmail.com"}]
description = "Bayesian degradation-mode analysis for Si-graphite blend anodes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
optional-dependencies = {examples = ["pandas", "matplotlib"], test = ["pytest"]}

[tool.setuptools]
packages = ["sigr_bdma"]
